<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="In this page we will see how different types of selectors works in CSS.">
    <meta name="author" content="Mohit Rajpal">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="css_selectors.css">
</head>
<body>
    <!-- example of element selector, what it does is, it selects all p elements. -->
    <p>This is a paragraph</p>

    <!-- Class selector, selects the elements that matches the specific class.-->
     <div class="highlight">This is a div tag. which has class in it.</div>

    <!-- ID selector, selects the element that matches the ID. -->
     <div id="special-note">This is a another div tag, which has its own id</div>

    <!-- Grouping selector, applies the same style to the multiple selectors at once.-->
     <h2>this is heading 2</h2>
     <h3>this is heading 3</h3>
     <h4>this is heading 4</h4>

    <!-- Descendant selectors, targets elements nested inside other elements, in this case the pre inside the div tag -->

    <div>
        <pre>this is a preformatted text nested inside a div tag.</pre>
    </div>
    
</body>
</html>
